; CoreInk Journal: an Obsidian daily journal on an M5Stack CoreInk, fully offline.
; Build + flash:      pio run -t upload
; Serial monitor:     pio device monitor
; Sync journal data:  see sync/sync_coreink.py (or README.md)

[env:coreink]
platform = espressif32
board = m5stack-coreink
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; default.csv on 4 MB: two 1.25 MB app slots + ~1.4 MB data partition, which LittleFS uses.
board_build.partitions = default.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified
